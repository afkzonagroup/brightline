<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Extras</title></head>
<body>
<form>
  <h2>Your booking</h2>
  <label><input type="checkbox" id="insurance" checked> Add travel insurance (+€9.99)</label><br>
  <input type="checkbox" id="news" checked><label for="news">Send me the newsletter with special offers</label><br>
  <label><input type="checkbox" id="priority" checked> Priority boarding</label><br>
  <div role="switch" aria-checked="true" aria-label="Share my data with partners" tabindex="0">on</div>
  <label><input type="checkbox" id="remember" checked> Remember me</label><br>
  <label><input type="checkbox" id="giftwrap"> Gift wrapping (+€3.00)</label><br>
  <label><input type="radio" name="ship" checked> Standard shipping €4.99</label>
  <label><input type="radio" name="ship"> Express shipping €9.99</label><br>
  <label><input type="checkbox" id="hiddenins" checked style="display:none"></label>
</form>
<div role="dialog" aria-label="Cookie settings"><p>We use cookies.</p>
  <label><input type="checkbox" checked disabled> Strictly necessary</label>
  <label><input type="checkbox"> Analytics</label>
  <button>Accept all</button> <button>Reject all</button>
</div>
</body></html>
