<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Popup</title>
<style>
.modal{position:fixed;top:20%;left:25%;width:50%;padding:24px;background:#fff;border:1px solid #ccc}
.yes{background:#0a7d32;color:#fff;border:0;padding:14px 28px;font-size:18px}
.no{background:none;border:0;color:#333;font-size:14px;text-decoration:underline}
</style></head>
<body>
<p>Shop content</p>
<div class="modal" role="dialog" aria-label="Discount">
  <h2>Get 10% off your first order</h2>
  <button class="yes">Yes, give me 10% off</button>
  <button class="no">No thanks, I prefer to pay full price</button>
</div>
<a href="#">Nah, I don't care about saving money</a>
</body></html>
